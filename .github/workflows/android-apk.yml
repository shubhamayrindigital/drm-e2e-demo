name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        id: version
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble release APK
        env:
          BACKEND_BASE_URL: https://drm-e2e-backend.onrender.com/
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PBACKEND_BASE_URL=$BACKEND_BASE_URL \
            -PAPP_VERSION_CODE=${{ github.run_number }} \
            -PAPP_VERSION_NAME=${{ steps.version.outputs.name }}

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/drm-e2e-demo-${{ steps.version.outputs.name }}.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            Automated release from commit ${{ github.sha }}.

            **APK**: `drm-e2e-demo-${{ steps.version.outputs.name }}.apk`
            **versionCode**: `${{ github.run_number }}`
            **versionName**: `${{ steps.version.outputs.name }}`
            **Backend**: `https://drm-e2e-backend.onrender.com/`
          files: android/app/build/outputs/apk/release/drm-e2e-demo-${{ steps.version.outputs.name }}.apk
          fail_on_unmatched_files: true

      - name: Upload APK artifact (non-main builds)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: drm-e2e-demo-${{ steps.version.outputs.name }}
          path: android/app/build/outputs/apk/release/drm-e2e-demo-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 30
